    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f5d77a;
            --maroon: #9b1c1c;
            --violet: #8b5cf6;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030508;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px 30px;
            position: relative;
            overflow-x: hidden;
        }
        /* Gold dust particle layer */
        #dust {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        /* Ambient lighting */
        body::before {
            content: '';
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 560px;
            height: 560px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.14) 0%, rgba(155, 28, 28, 0.07) 40%, rgba(3, 5, 8, 0) 72%);
            z-index: -2;
            animation: pulseGlow 6s ease-in-out infinite alternate;
            pointer-events: none;
        }
        /* Dotted grid texture */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 22px 22px;
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
            z-index: -3;
            pointer-events: none;
        }
        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(0.95); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(1.05); opacity: 1; }
        }
        /* Cursor-follow glow (desktop) */
        .cursor-glow {
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.09), transparent 65%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Header Section */
        .header-section {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .header-section > * { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .header-section > :nth-child(2) { animation-delay: 0.12s; }
        .header-section > :nth-child(3) { animation-delay: 0.2s; }
        .header-section > :nth-child(4) { animation-delay: 0.28s; }

        /* Logo with rotating gold/maroon ring, float and 3D tilt */
        .logo-wrap {
            perspective: 700px;
            margin-bottom: 22px;
        }
        .logo-ring {
            position: relative;
            width: 168px;
            height: 168px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            animation: float 5s ease-in-out infinite;
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
            cursor: pointer;
        }
        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--gold), var(--maroon), var(--gold-light), var(--violet), var(--gold));
            animation: spin 7s linear infinite;
            filter: blur(0.3px);
        }
        .logo-ring::after {
            content: '';
            position: absolute;
            inset: -22px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.35), transparent 65%);
            z-index: -1;
            animation: breathe 3.5s ease-in-out infinite;
        }
        .logo-ring img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #030508;
            display: block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        /* Shine sweep across the logo */
        .logo-shine {
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
        }
        .logo-shine::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -120%;
            width: 60%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            transform: rotate(20deg);
            animation: shine 5s ease-in-out infinite;
        }
        @keyframes shine {
            0%, 60% { left: -120%; }
            100% { left: 160%; }
        }
        @keyframes float {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -8px; }
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.55; transform: scale(0.96); }
            50% { opacity: 1; transform: scale(1.04); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Title with gold shimmer */
        .header-section h1 {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(100deg, #ffffff 0%, #ffffff 40%, var(--gold-light) 50%, #ffffff 60%, #ffffff 100%);
            background-size: 250% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 18px rgba(212, 175, 55, 0.25));
            animation: fadeUpSoft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both, titleShimmer 5s linear 1s infinite;
        }
        @keyframes fadeUpSoft {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes titleShimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -150% 0; }
        }
        .tagline {
            font-size: 0.92rem;
            color: var(--gold);
            font-weight: 500;
            font-style: italic;
            letter-spacing: 0.4px;
            margin-bottom: 18px;
            opacity: 0.95;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 1.3em;
        }
        .tagline i { font-size: 0.8rem; opacity: 0.85; }
        .typed::after {
            content: '|';
            margin-left: 2px;
            animation: blink 0.9s step-end infinite;
        }
        .typed.done::after { content: ''; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Estd Box */
        .estd-box {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(12, 16, 28, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f3f4f6;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15), inset 0 0 10px rgba(212, 175, 55, 0.05);
            backdrop-filter: blur(10px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both, borderShift 4s linear infinite;
        }
        .estd-box i { color: var(--gold); font-size: 0.75rem; animation: twinkle 2.4s ease-in-out infinite; }
        .estd-box i:last-child { animation-delay: 1.2s; }
        @keyframes twinkle {
            0%, 100% { opacity: 0.5; transform: scale(0.85) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.15) rotate(72deg); }
        }
        @keyframes borderShift {
            0% { border-color: rgba(212, 175, 55, 0.4); box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
            50% { border-color: rgba(155, 28, 28, 0.7); box-shadow: 0 0 20px rgba(155, 28, 28, 0.3); }
            100% { border-color: rgba(212, 175, 55, 0.4); box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
        }

        /* Section labels */
        .section-label {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #9ca3af;
            margin: 6px 0 2px;
        }
        .section-label i { color: var(--gold); }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.35), transparent);
        }

        /* Links Section */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .links-list > * { animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .links-list > :nth-child(1) { animation-delay: 0.40s; }
        .links-list > :nth-child(2) { animation-delay: 0.48s; }
        .links-list > :nth-child(3) { animation-delay: 0.56s; }
        .links-list > :nth-child(4) { animation-delay: 0.64s; }
        .links-list > :nth-child(5) { animation-delay: 0.72s; }
        .links-list > :nth-child(6) { animation-delay: 0.80s; }
        .links-list > :nth-child(7) { animation-delay: 0.88s; }
        .links-list > :nth-child(8) { animation-delay: 0.96s; }
        .links-list > :nth-child(9) { animation-delay: 1.04s; }

        /* RGB Neon LED Touch Sense Boxes */
        .link-card {
            --x: 50%;
            --y: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(13, 18, 30, 0.85), rgba(7, 10, 18, 0.95));
            padding: 13px 20px 13px 13px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, background 0.35s ease;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
            isolation: isolate;
            overflow: hidden;
        }
        /* Animated gradient border */
        .link-card::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 1px;
            border-radius: 16px;
            background: linear-gradient(90deg, var(--gold), var(--maroon), var(--violet), #3b82f6, var(--gold));
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            opacity: 0.35;
            transition: opacity 0.3s ease;
            animation: rgbFlow 6s linear infinite;
            pointer-events: none;
        }
        /* Spotlight that follows the finger / cursor */
        .link-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(220px circle at var(--x) var(--y), var(--spot, rgba(212, 175, 55, 0.16)), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes rgbFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .link-card:hover, .link-card:focus-visible {
            transform: translateY(-4px) scale(1.01);
            background: linear-gradient(135deg, rgba(20, 27, 45, 0.95), rgba(10, 14, 25, 0.98));
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 25px var(--glow, rgba(212, 175, 55, 0.35)), 0 0 45px rgba(139, 92, 246, 0.15);
            outline: none;
        }
        .link-card:active { transform: translateY(-1px) scale(0.985); }
        .link-card:hover::before, .link-card:focus-visible::before { opacity: 1; }
        .link-card:hover::after, .link-card:focus-visible::after { opacity: 1; }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1;
        }
        /* App-style icon tiles */
        .icon-tile {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 12px;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
        }
        .icon-tile::after {
            /* glossy highlight */
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.28), transparent 45%);
            pointer-events: none;
        }
        .icon-tile i { font-size: 1.2rem; color: #ffffff; position: relative; z-index: 1; }
        .icon-tile svg { width: 26px; height: 26px; position: relative; z-index: 1; }
        .link-card:hover .icon-tile {
            transform: scale(1.1) rotate(-6deg);
            box-shadow: 0 0 22px var(--glow, rgba(212, 175, 55, 0.5)), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* Reshvah links */
        .tile-web { background: linear-gradient(135deg, #f5d77a, #d4af37 55%, #9c7a1c); }
        .tile-web i { color: #1a1205; }
        .tile-research { background: linear-gradient(135deg, #c53030, #8b1a1a 60%, #5c0f0f); }
        .tile-campaign { background: linear-gradient(135deg, #a78bfa, #7c3aed 55%, #db2777); }
        .card-web { --glow: rgba(212, 175, 55, 0.5); --spot: rgba(212, 175, 55, 0.18); }
        .card-research { --glow: rgba(197, 48, 48, 0.5); --spot: rgba(197, 48, 48, 0.18); }
        .card-campaign { --glow: rgba(167, 139, 250, 0.5); --spot: rgba(167, 139, 250, 0.18); }

        /* Official brand icons */
        .tile-yt, .tile-fb, .tile-li { background: #ffffff; }
        .tile-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
        .tile-ig svg { width: 24px; height: 24px; }
        .card-yt { --glow: rgba(255, 0, 0, 0.5); --spot: rgba(255, 0, 0, 0.15); }
        .card-li { --glow: rgba(10, 102, 194, 0.6); --spot: rgba(10, 102, 194, 0.2); }
        .card-ig { --glow: rgba(214, 36, 159, 0.55); --spot: rgba(214, 36, 159, 0.17); }
        .card-fb { --glow: rgba(8, 102, 255, 0.6); --spot: rgba(8, 102, 255, 0.2); }

        .link-card .fa-arrow-right {
            font-size: 0.8rem;
            color: #6b7280;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 1;
        }
        .link-card:hover .fa-arrow-right {
            transform: translateX(6px);
            color: var(--gold);
        }

        /* Tap ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.35), rgba(212, 175, 55, 0.15) 60%, transparent 70%);
            animation: ripple 0.7s ease-out forwards;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* Footer */
        .footer {
            margin-top: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fadeUp 0.8s ease 1.1s both;
        }
        .footer-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gold);
            font-size: 0.65rem;
            opacity: 0.7;
        }
        .footer-divider::before, .footer-divider::after {
            content: '';
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
        }
        .footer-text {
            font-size: 0.78rem;
            color: #6b7280;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .link-card { padding: 12px 16px 12px 12px; }
            .icon-tile { width: 40px; height: 40px; }
            .icon-tile svg { width: 23px; height: 23px; }
            .header-section h1 { font-size: 1.8rem; }
            .logo-ring { width: 148px; height: 148px; }
        }

        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
            #dust, .cursor-glow { display: none; }
        }
    </style>
</head>

    <script>
    (function () {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var finePointer = window.matchMedia('(pointer: fine)').matches;

        /* Spotlight follow + tap ripple on every card */
        document.querySelectorAll('.link-card').forEach(function (card) {
            card.addEventListener('pointermove', function (e) {
                var r = card.getBoundingClientRect();
                card.style.setProperty('--x', (e.clientX - r.left) + 'px');
                card.style.setProperty('--y', (e.clientY - r.top) + 'px');
            });
            card.addEventListener('pointerdown', function (e) {
                if (reduce) return;
                var r = card.getBoundingClientRect();
                var size = Math.max(r.width, r.height) * 0.6;
                var s = document.createElement('span');
                s.className = 'ripple';
                s.style.width = s.style.height = size + 'px';
                s.style.left = (e.clientX - r.left - size / 2) + 'px';
                s.style.top = (e.clientY - r.top - size / 2) + 'px';
                card.appendChild(s);
                setTimeout(function () { s.remove(); }, 750);
            });
        });

        if (reduce) return;

        /* Typewriter tagline */
        var typed = document.querySelector('.typed');
        var text = typed.getAttribute('data-text');
        typed.textContent = '';
        var i = 0;
        setTimeout(function type() {
            typed.textContent = text.slice(0, ++i);
            if (i < text.length) setTimeout(type, 38);
            else setTimeout(function () { typed.classList.add('done'); }, 1200);
        }, 650);

        /* 3D tilt on the logo */
        var logo = document.getElementById('logo');
        if (finePointer) {
            logo.addEventListener('pointermove', function (e) {
                var r = logo.getBoundingClientRect();
                var px = (e.clientX - r.left) / r.width - 0.5;
                var py = (e.clientY - r.top) / r.height - 0.5;
                logo.style.transform = 'rotateY(' + (px * 22) + 'deg) rotateX(' + (-py * 22) + 'deg) scale(1.04)';
            });
            logo.addEventListener('pointerleave', function () { logo.style.transform = ''; });
        }
        /* Tap the logo for a spin */
        logo.addEventListener('click', function () {
            logo.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(360deg)' }],
                { duration: 900, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' });
        });

        /* Cursor glow (desktop only) */
        if (finePointer) {
            var glow = document.querySelector('.cursor-glow');
            window.addEventListener('pointermove', function (e) {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
                glow.style.opacity = 1;
            });
            document.addEventListener('pointerleave', function () { glow.style.opacity = 0; });
        }

        /* Floating gold dust */
        var c = document.getElementById('dust');
        var ctx = c.getContext('2d');
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var W, H, parts = [];
        function resize() {
            W = window.innerWidth; H = window.innerHeight;
            c.width = W * dpr; c.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        function make(initial) {
            var gold = Math.random() > 0.25;
            return {
                x: Math.random() * W,
                y: initial ? Math.random() * H : H + 10,
                r: Math.random() * 1.6 + 0.4,
                vy: Math.random() * 0.35 + 0.12,
                vx: (Math.random() - 0.5) * 0.15,
                a: Math.random() * 0.5 + 0.25,
                tw: Math.random() * Math.PI * 2,
                col: gold ? '212,175,55' : '197,48,48'
            };
        }
        resize();
        window.addEventListener('resize', resize);
        var count = Math.round(Math.min(70, (W * H) / 14000));
        for (var k = 0; k < count; k++) parts.push(make(true));
        (function loop() {
            ctx.clearRect(0, 0, W, H);
            for (var j = 0; j < parts.length; j++) {
                var p = parts[j];
                p.y -= p.vy; p.x += p.vx; p.tw += 0.03;
                if (p.y < -10) parts[j] = p = make(false);
                var alpha = p.a * (0.6 + 0.4 * Math.sin(p.tw));
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(' + p.col + ',' + alpha + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(' + p.col + ',0.8)';
                ctx.fill();
            }
            requestAnimationFrame(loop);
        })();
    })();
    </script>
